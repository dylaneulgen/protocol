<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- Lock things down: no REMOTE content (no http/https), but allow our own local
       files. We must include the file: scheme because Chromium treats a file://
       page as having an opaque origin, so 'self' alone matches nothing and would
       block our own stylesheet and scripts. data:/blob: support icons + export. -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self' file:; style-src 'self' file: 'unsafe-inline'; img-src 'self' file: data:; font-src 'self' file:; connect-src 'self' file:;">
  <title>Protocol</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="app">

  <!-- Custom (frameless) title bar. Draggable; holds the active area's controls on
       the left, the Today pill on the right, and the window buttons in the corner. -->
  <div class="titlebar">
    <div class="tb-context">
      <div class="tbc" data-tbc="habits">
        <button id="btn-add-habit" class="primary">+ Add habit</button>
        <button class="tb-search-btn" data-search-btn title="Search habits (Ctrl+F)">
          <svg class="search-ic" width="14" height="14" viewBox="0 0 16 16" aria-hidden="true">
            <circle cx="6.7" cy="6.7" r="4.2" fill="none" stroke="currentColor" stroke-width="1.6"/>
            <line x1="9.9" y1="9.9" x2="14" y2="14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
          </svg>
          <span>Search</span>
        </button>
      </div>
      <div class="tbc" data-tbc="notes">
        <button id="btn-new-note" class="primary">+ Note</button>
        <button class="tb-search-btn" data-search-btn title="Search notes (Ctrl+F)">
          <svg class="search-ic" width="14" height="14" viewBox="0 0 16 16" aria-hidden="true">
            <circle cx="6.7" cy="6.7" r="4.2" fill="none" stroke="currentColor" stroke-width="1.6"/>
            <line x1="9.9" y1="9.9" x2="14" y2="14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
          </svg>
          <span>Search</span>
        </button>
      </div>
    </div>

    <div class="tb-drag"></div>

    <!-- The tiny always-visible click target: today's checklist lives behind it. -->
    <button id="today-pill" class="today-pill" title="What’s due today"></button>

    <div class="tb-controls">
      <button class="tb-btn" data-win="min" title="Minimize" aria-label="Minimize">&#xE921;</button>
      <button class="tb-btn" data-win="max" title="Maximize" aria-label="Maximize">&#xE922;</button>
      <button class="tb-btn tb-close" data-win="close" title="Close" aria-label="Close">&#xE8BB;</button>
    </div>
  </div>

  <div class="workspace">
    <!-- The one sidebar -->
    <nav class="sidebar">
      <div class="side-nav">
        <button class="side-item" data-view-area="habits">Habits</button>
        <button class="side-item" data-view-area="notes">Notes</button>
      </div>
      <div class="stopwatch">
        <span class="sw-time" id="sw-time">0:00</span>
        <div class="sw-btns">
          <button id="sw-toggle" class="sw-btn">Start</button>
          <button id="sw-reset" class="sw-btn">Reset</button>
        </div>
      </div>
    </nav>

    <!-- The single main view. Exactly one .area is visible at a time. -->
    <main class="main">
      <div id="error-banner" class="error-banner" hidden></div>

      <section class="area area-habits" data-area="habits">
        <div id="habit-list" class="habit-list"></div>
      </section>

      <section class="area area-notes" data-area="notes">
        <div class="notes-split">
          <aside class="notes-side">
            <div class="notes-side-head">
              <button class="rail-toggle" id="btn-toggle-noteslist" title="Collapse">‹</button>
            </div>
            <div id="notes-list" class="notes-list"></div>
          </aside>
          <div class="notes-editor">
            <input id="note-title" type="text" class="note-title" placeholder="Title">
            <textarea id="note-body" class="note-body"></textarea>
          </div>
        </div>
      </section>
    </main>
  </div>

  <!-- Habit editor: what, which days, what time, how long -->
  <dialog id="habit-dialog">
    <form id="habit-form">
      <h3 id="habit-dialog-title">New habit</h3>

      <label class="field">What
        <input id="hb-title" type="text" autocomplete="off" placeholder="e.g. Meditate">
      </label>

      <fieldset class="field">
        <legend>When</legend>
        <div class="dow" id="hb-dow" aria-label="Days of week"></div>
        <div class="row">
          <label>Time (optional) <input id="hb-time" type="text" autocomplete="off" placeholder="e.g. 7:00 AM"></label>
        </div>
        <div id="hb-time-hint" class="hint"></div>
      </fieldset>

      <label class="field">How long (optional)
        <input id="hb-duration" type="text" autocomplete="off" placeholder="e.g. 20m or 1h30m">
      </label>
      <div id="hb-duration-hint" class="hint"></div>

      <label class="field">Notes (optional)
        <textarea id="hb-notes" rows="2"></textarea>
      </label>

      <menu class="dialog-actions">
        <button type="button" id="hb-cancel" class="ghost">Cancel</button>
        <button type="submit" id="hb-save" class="primary">Save</button>
      </menu>
    </form>
  </dialog>

  <!-- Today popup: the checklist behind the pill. Opened non-modally. -->
  <dialog id="today-pop" class="today-pop">
    <div class="tp-head">
      <span class="tp-head-label">Today</span>
      <span id="today-date" class="tp-date"></span>
    </div>
    <div id="today-list" class="tp-list"></div>
    <div id="today-foot" class="tp-footline"></div>
  </dialog>

  <!-- Page-scoped search palette (top-bar Search button / Ctrl+F). Opened non-modally. -->
  <dialog id="search-dialog" class="search-dialog">
    <div class="search-box">
      <input id="search-input" type="text" placeholder="Search habits and notes…" autocomplete="off" spellcheck="false">
      <button type="button" id="search-close" class="ghost">Esc</button>
    </div>
    <div id="search-results" class="search-results"></div>
    <div class="search-foot">↑ ↓ to move · Enter to open · Esc to close</div>
  </dialog>

  <!-- Transient feedback (undo / redo) -->
  <div id="toast" class="toast" hidden></div>

  <!-- Load order: pure logic → store → actions → panels → bootstrap. -->
  <script src="js/util.js"></script>
  <script src="js/model.js"></script>
  <script src="js/store.js"></script>
  <script src="js/actions.js"></script>
  <script src="js/journal.js"></script>
  <script src="js/habits.js"></script>
  <script src="js/today.js"></script>
  <script src="js/search.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
